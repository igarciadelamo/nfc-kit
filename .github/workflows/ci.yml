name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Managed-device suites are not run here: they need an emulator and are
      # executed locally (see the README).
      - name: Unit tests and builds
        run: >
          ./gradlew
          testDebugUnitTest
          assembleDebug
          assembleRelease
          :sample:verifyReleaseHasNoNfcTest