name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK with the licenses accepted;
      # AGP downloads the compileSdk platform if it is missing.
      - uses: gradle/actions/setup-gradle@v4

      # Managed-device suites are not run here: they need an emulator and are
      # executed locally (see the README). Maven Central occasionally returns
      # 429 to shared runner IPs, so retry the build a couple of times.
      - name: Unit tests and builds
        run: |
          for attempt in 1 2 3; do
            if ./gradlew \
              testDebugUnitTest \
              assembleDebug \
              assembleRelease \
              :sample:verifyReleaseHasNoNfcTest; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1