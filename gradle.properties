org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true

group=es.igarciadelamo
version=0.3.0

# Managed devices are expensive; run one at a time across modules.
android.experimental.testOptions.managedDevices.maxConcurrentDevices=1

# API 26 is the compatibility floor; GMD gates old images behind this flag.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
